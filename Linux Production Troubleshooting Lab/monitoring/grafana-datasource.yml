# Grafana datasource provisioning: auto-adds Prometheus so you don't have to
# click through the UI. Copied to /etc/grafana/provisioning/datasources/ by
# provisioning/node4-monitoring.sh.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
